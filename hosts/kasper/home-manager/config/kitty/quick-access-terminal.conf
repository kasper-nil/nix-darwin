# ============================================================================
# quick-access-terminal.conf — the quake/dropdown window.
# Toggle it with skhd: ctrl+alt+cmd-t runs `kitten quick-access-terminal`.
# It inherits kitty.conf (font, Catppuccin, keybindings, tabs, splits).
# This panel floats ABOVE other apps natively — no yabai, no always-on-top hack.
# ============================================================================
#
# kitty panel sizing takes cell counts or px — NOT percentages — so a true
# "80% of screen" can't adapt across monitors. Full-screen + transparency +
# blur DOES adapt to any display, so that's the default below.

# Full-screen frosted glass over the whole display.
# NOTE: background_blur is NOT a quick-access-terminal.conf option — it is a
# kitty.conf option, so it must be forwarded with kitty_override or it is
# silently ignored. background_opacity IS a native option here (it has a
# different default for the panel), so it does not need forwarding.
edge                center
background_opacity  0.80
kitty_override      background_blur=64

# ── Alternatives (uncomment one block) ──────────────────────────────────────
# Classic top dropdown, full width / partial height:
#   edge  top
#   lines 28
#   background_opacity 1.0
#   kitty_override background_blur=0
#
# Centered fixed-size box (cells, or append px e.g. 1500px). No percentages:
#   edge    center-sized
#   columns 1500px
#   lines   950px
#   background_opacity 1.0
#   kitty_override background_blur=0

# Keep it visible until YOU toggle it. Do NOT enable hide_on_focus_loss: with
# yabai focus_follows_mouse=autoraise it would vanish when the mouse crosses
# another window (the exact annoyance from the old setup).
hide_on_focus_loss no
